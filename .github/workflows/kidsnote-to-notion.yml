# Kidsnote → Notion mirror
#
# Kidsnote's login flow can no longer be driven by a headless HTTP client
# (the page is a Next.js SPA). The workflow relies on a `sessionid` cookie
# the operator extracts manually from a logged-in browser session and stores
# in the KIDSNOTE_SESSION_COOKIE secret. That cookie typically lasts ~30 days.
#
# Dedup: each new Notion page records the kidsnote `Report ID`. Subsequent
# runs query the DB once at startup and skip reports whose id is already
# stored, so re-running is safe and idempotent.
#
# Required GitHub repository secrets (Settings → Secrets and variables → Actions):
#   KIDSNOTE_SESSION_COOKIE   value of the `sessionid` cookie for kidsnote.com
#   NOTION_TOKEN              internal integration token from notion.so/profile/integrations
#   NOTION_DATABASE_ID        32-char hex id from your Notion DB URL
# Optional Google Drive fallback secrets:
#   GOOGLE_DRIVE_FOLDER_ID
#   GOOGLE_OAUTH_CLIENT_ID
#   GOOGLE_OAUTH_CLIENT_SECRET
#   GOOGLE_OAUTH_REFRESH_TOKEN

name: Kidsnote → Notion mirror

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Only mirror the N most recent reports (leave empty for all)"
        required: false
        default: ""
      monthly_sample:
        description: "Unit-test mode: pick one report per month for breadth coverage"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      force_refresh:
        description: "Archive each report's existing Notion page before re-publish (use after prompt/LLM changes)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      title_quality_only:
        description: "Run Gemma title QA only; no Notion pages or media upload"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      refresh_report_titles_only:
        description: "Regenerate existing Notion report titles in place; no media upload"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      auth_probe_only:
        description: "Test Kidsnote browser login only; no Ollama, Notion, or backup writes"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      title_source_chars:
        description: "Title QA source characters per body/comment; 0 hides source text"
        required: false
        default: "500"
      title_refresh_sleep_sec:
        description: "Seconds to wait after each Notion title update"
        required: false
        default: "5"
      llm_mode:
        description: "auto skips Gemma for limit/monthly_sample tests; choose gemma to force LLM"
        required: false
        default: "auto"
        type: choice
        options: ["auto", "gemma", "fast_fallback"]
  # Auto-resume: a multi-year backfill can take days of compute,
  # but a GitHub-hosted runner caps a single job at 6 hours. Without
  # cron, the user would have to manually re-trigger after every cap.
  # With this schedule the workflow self-resumes every 4 hours; the
  # script tracks elapsed time and exits cleanly at 5h30m so the next
  # cron run can pick up via dedup. Once the backup is complete each
  # cron run finishes in ~1-2 minutes (no new alimnotas to process).
  schedule:
    - cron: "15 */4 * * *"

permissions:
  contents: read

concurrency:
  group: kidsnote-to-notion
  cancel-in-progress: false

env:
  OLLAMA_MODEL: gemma4:12b-it-qat
  OLLAMA_CACHE_KEY: ollama-gemma4-12b-it-qat-v1

jobs:
  mirror:
    runs-on: ubuntu-latest
    # Long timeout: a multi-year backfill with photo-heavy reports
    # (avg 15-25 images/report + Ollama-driven titles/dashboards) ran past
    # the 6h cap on the first try, so we ask for 12h. GitHub-hosted
    # runners cap public repos at 35 hours of wall-time per workflow.
    # Re-runs after the first backfill are fast (dedup skips done).
    timeout-minutes: 720

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install fetcher deps
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/kidsnote_fetch/requirements.txt

      - name: Preflight guard
        run: |
          set -eu
          echo "workflow sha: ${GITHUB_SHA}"
          echo "ollama model: ${OLLAMA_MODEL}"
          echo "ollama cache key: ${OLLAMA_CACHE_KEY}"
          echo "title quality only: ${{ inputs.title_quality_only || 'false' }}"
          echo "refresh report titles only: ${{ inputs.refresh_report_titles_only || 'false' }}"
          echo "auth probe only: ${{ inputs.auth_probe_only || 'false' }}"
          echo "llm mode: ${{ inputs.llm_mode || 'auto' }}"
          echo "use ollama: ${{ inputs.auth_probe_only != 'true' && (github.event_name == 'schedule' || inputs.title_quality_only == 'true' || inputs.refresh_report_titles_only == 'true' || inputs.llm_mode == 'gemma' || (inputs.llm_mode == 'auto' && inputs.limit == '' && inputs.monthly_sample != 'true')) }}"
          echo "requirements:"
          nl -ba tools/kidsnote_fetch/requirements.txt

          if [ "${OLLAMA_MODEL}" != "gemma4:12b-it-qat" ]; then
            echo "::error::OLLAMA_MODEL must be gemma4:12b-it-qat, got '${OLLAMA_MODEL}'"
            exit 1
          fi
          if [ "${{ inputs.refresh_report_titles_only || 'false' }}" = "true" ] && [ "${{ inputs.force_refresh || 'false' }}" = "true" ]; then
            echo "::error::refresh_report_titles_only cannot be combined with force_refresh"
            exit 1
          fi
          if [ "${{ inputs.refresh_report_titles_only || 'false' }}" = "true" ] && [ "${{ inputs.title_quality_only || 'false' }}" = "true" ]; then
            echo "::error::refresh_report_titles_only cannot be combined with title_quality_only"
            exit 1
          fi
          if [ "${{ inputs.auth_probe_only || 'false' }}" = "true" ] && { [ "${{ inputs.force_refresh || 'false' }}" = "true" ] || [ "${{ inputs.title_quality_only || 'false' }}" = "true" ] || [ "${{ inputs.refresh_report_titles_only || 'false' }}" = "true" ]; }; then
            echo "::error::auth_probe_only cannot be combined with a Notion/title mutation mode"
            exit 1
          fi
          if grep -Eiq '^[[:space:]]*(pillow|piexif)([[:space:]<>=!~]|$)' tools/kidsnote_fetch/requirements.txt; then
            echo "::error::pillow/piexif must stay out of requirements.txt; media must be preserved without EXIF stripping or compression"
            exit 1
          fi

      - name: Install Playwright Chromium for auth probe
        if: ${{ inputs.auth_probe_only == 'true' }}
        run: |
          pip install -r tools/kidsnote_fetch/requirements-browser-auth.txt
          python -m playwright install --with-deps chromium

      - name: Probe Kidsnote browser login
        if: ${{ inputs.auth_probe_only == 'true' }}
        env:
          KIDSNOTE_USERNAME: ${{ secrets.KIDSNOTE_USERNAME }}
          KIDSNOTE_PASSWORD: ${{ secrets.KIDSNOTE_PASSWORD }}
        run: python tools/kidsnote_fetch/browser_auth_probe.py

      # ---- Ollama for speaker-aware report titles + LLM dashboards ----
      # Local LLM runs inside the runner — no API key / cost.
      # gemma4:12b-it-qat is pinned by the preflight guard above so prompt behavior
      # and cache identity drift loudly instead of silently changing output.
      - name: Cache Ollama models
        if: ${{ inputs.auth_probe_only != 'true' && (github.event_name == 'schedule' || inputs.title_quality_only == 'true' || inputs.refresh_report_titles_only == 'true' || inputs.llm_mode == 'gemma' || (inputs.llm_mode == 'auto' && inputs.limit == '' && inputs.monthly_sample != 'true')) }}
        id: ollama-cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ${{ env.OLLAMA_CACHE_KEY }}

      - name: Install Ollama + pull model
        if: ${{ inputs.auth_probe_only != 'true' && (github.event_name == 'schedule' || inputs.title_quality_only == 'true' || inputs.refresh_report_titles_only == 'true' || inputs.llm_mode == 'gemma' || (inputs.llm_mode == 'auto' && inputs.limit == '' && inputs.monthly_sample != 'true')) }}
        run: |
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi
          # Start ollama in background
          ollama serve > /tmp/ollama.log 2>&1 &
          # Wait for ready (max 30s)
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/version >/dev/null 2>&1; then
              echo "ollama ready after ${i}s"
              break
            fi
            sleep 1
          done
          # Pull model (cached after first run)
          ollama pull "${OLLAMA_MODEL}"
          # Warm the model before the real title QA/backup request. This makes
          # "model installed but returns empty text" fail with useful logs.
          python - <<'PY' || { echo "::error::Ollama warmup failed"; tail -n 120 /tmp/ollama.log || true; exit 1; }
          import json
          import os
          import sys
          import time
          import urllib.request

          host = "http://localhost:11434"
          model = os.environ["OLLAMA_MODEL"]
          payload = {
              "model": model,
              "messages": [{"role": "user", "content": "다음 JSON만 출력해: {\"title\":\"테스트\"}"}],
              "stream": False,
              "think": False,
              "keep_alive": "30m",
              "format": {
                  "type": "object",
                  "properties": {"title": {"type": "string"}},
                  "required": ["title"],
              },
              "options": {
                  "temperature": 0.2,
                  "top_p": 0.95,
                  "top_k": 64,
                  "num_predict": 96,
              },
          }
          for attempt in range(1, 4):
              req = urllib.request.Request(
                  f"{host}/api/chat",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=180) as resp:
                      body = json.loads(resp.read().decode("utf-8"))
                  content = ((body.get("message") or {}).get("content") or "").strip()
                  print(f"ollama warmup attempt {attempt}: {content or '(empty)'}")
                  if content and "title" in content:
                      sys.exit(0)
              except Exception as exc:
                  print(f"ollama warmup attempt {attempt} failed: {exc}")
              time.sleep(2)
          sys.exit(1)
          PY

      - name: Skip Ollama for fast fallback test
        if: ${{ inputs.auth_probe_only != 'true' && github.event_name != 'schedule' && inputs.title_quality_only != 'true' && inputs.refresh_report_titles_only != 'true' && inputs.llm_mode != 'gemma' && (inputs.llm_mode != 'auto' || inputs.limit != '' || inputs.monthly_sample == 'true') }}
        run: |
          echo "Skipping Ollama/Gemma setup for fast workflow test."
          echo "Report titles will use source-text fallback; LLM dashboards are skipped in this mode."

      - name: Mirror Kidsnote → Notion
        if: ${{ inputs.auth_probe_only != 'true' }}
        env:
          KIDSNOTE_SESSION_COOKIE: ${{ secrets.KIDSNOTE_SESSION_COOKIE }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          # Tell notion_mirror.py where Ollama lives + which model to use
          OLLAMA_MODEL: ${{ env.OLLAMA_MODEL }}
          USE_OLLAMA: ${{ github.event_name == 'schedule' || inputs.title_quality_only == 'true' || inputs.refresh_report_titles_only == 'true' || inputs.llm_mode == 'gemma' || (inputs.llm_mode == 'auto' && inputs.limit == '' && inputs.monthly_sample != 'true') }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -eu
          if [ "${USE_OLLAMA}" = "true" ]; then
            export OLLAMA_HOST="http://localhost:11434"
          else
            unset OLLAMA_HOST
          fi
          if [ "${{ inputs.refresh_report_titles_only }}" = "true" ]; then
            ARGS=( "--auth-mode" "session-cookie-env" "--refresh-report-titles-only" "--no-local-save" )
            ARGS+=( "--title-refresh-sleep-sec" "${{ inputs.title_refresh_sleep_sec }}" )
          elif [ "${{ inputs.title_quality_only }}" = "true" ]; then
            ARGS=( "--auth-mode" "session-cookie-env" "--title-quality-only" "--no-local-save" )
            ARGS+=( "--title-source-chars" "${{ inputs.title_source_chars }}" )
          else
            ARGS=( "--auth-mode" "session-cookie-env" "--publish-to-notion" "--no-local-save" )
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS+=( "--limit" "${{ inputs.limit }}" )
          fi
          if [ "${{ inputs.monthly_sample }}" = "true" ]; then
            ARGS+=( "--monthly-sample" )
          fi
          if [ "${{ inputs.force_refresh }}" = "true" ] && [ "${{ inputs.title_quality_only }}" != "true" ] && [ "${{ inputs.refresh_report_titles_only }}" != "true" ]; then
            ARGS+=( "--force-refresh" )
          fi
          python tools/kidsnote_fetch/fetch.py "${ARGS[@]}"

      - name: Verify required secrets were present
        if: ${{ failure() && inputs.auth_probe_only != 'true' }}
        env:
          KIDSNOTE_SESSION_COOKIE: ${{ secrets.KIDSNOTE_SESSION_COOKIE }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          REQUIRED=( KIDSNOTE_SESSION_COOKIE )
          if [ "${{ inputs.title_quality_only }}" != "true" ]; then
            REQUIRED+=( NOTION_TOKEN NOTION_DATABASE_ID )
          fi
          for s in "${REQUIRED[@]}"; do
            if [ -z "${!s:-}" ]; then
              echo "::error::repo secret '$s' is empty or unset"
            fi
          done
